name: PNR Check

on:
  schedule:
    - cron: "00 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: pnr-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check PNR 1
        run: python check_pnr.py
        env:
          LABEL: "Train 1"
          STATE_FILE: state_1.json
          PNR: ${{ secrets.PNR_1 }}
          API_URL: ${{ secrets.API_URL_1 }}
          API_HOST: ${{ secrets.API_HOST_1 }}
          API_KEY: ${{ secrets.API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Check PNR 2
        if: always()
        run: python check_pnr.py
        env:
          LABEL: "Train 2"
          STATE_FILE: state_2.json
          PNR: ${{ secrets.PNR_2 }}
          API_URL: ${{ secrets.API_URL_2 }}
          API_HOST: ${{ secrets.API_HOST_2 }}
          API_KEY: ${{ secrets.API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --staged --quiet || (git commit -m "Update PNR state" && git push)
