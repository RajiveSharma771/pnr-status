name: PNR Check

on:
  schedule:
    - cron: "00 01 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: pnr-check

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        train: [train1, train2]
    runs-on: ubuntu-latest
    environment: ${{ matrix.train }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check PNR
        run: python check_pnr.py
        env:
          LABEL: ${{ matrix.train }}
          STATE_FILE: state_${{ matrix.train }}.json
          PNR: ${{ secrets.PNR }}
          API_URL: ${{ secrets.API_URL }}
          API_HOST: ${{ secrets.API_HOST }}
          API_KEY: ${{ secrets.API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --staged --quiet || (git commit -m "Update ${{ matrix.train }} state" && git pull --rebase && git push)
